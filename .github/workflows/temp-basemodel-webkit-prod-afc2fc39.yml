name: Temporary BaseModel Production WebKit Acceptance afc2fc39

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  webkit-production:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    steps:
      - name: Run public black-box Production acceptance
        env:
          BASE_URL: https://basemodel-preview.vercel.app
          EXPECTED_BASEMODEL_SHA: afc2fc39e989f74477f8ffafa4db713c9a14da8b
        run: |
          set -eu
          grep -q '^VERSION_ID="24.04"' /etc/os-release
          cat /etc/os-release
          mkdir -p /tmp/basemodel-webkit
          cd /tmp/basemodel-webkit
          npm init -y >/dev/null
          npm install --ignore-scripts @playwright/test@1.62.1
          npx playwright --version
          node <<'NODE'
          const { webkit } = require('@playwright/test');

          (async () => {
            const baseURL = process.env.BASE_URL;
            const expectedSha = process.env.EXPECTED_BASEMODEL_SHA;
            const browser = await webkit.launch();
            const version = browser.version();
            console.log(`WEBKIT_VERSION=${version}`);
            if (version !== '26.5') throw new Error(`expected WebKit 26.5, got ${version}`);

            const routes = [
              '/',
              '/en/',
              '/models/',
              '/en/models/',
              '/landscape/',
              '/families/',
              '/papers/agentbench/',
              '/research/seed-openevo/results/',
            ];
            const viewports = [
              { name: 'mobile', width: 390, height: 844 },
              { name: 'tablet', width: 768, height: 1024 },
              { name: 'desktop', width: 1440, height: 1000 },
            ];
            const themes = ['light', 'dark'];
            let checks = 0;

            for (const viewport of viewports) {
              for (const theme of themes) {
                const context = await browser.newContext({ viewport });
                await context.addInitScript((value) => localStorage.setItem('atlas-theme', value), theme);
                for (const route of routes) {
                  const page = await context.newPage();
                  const errors = [];
                  page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
                  page.on('console', message => {
                    if (message.type() === 'error') errors.push(`console: ${message.text()}`);
                  });
                  const response = await page.goto(`${baseURL}${route}`, { waitUntil: 'domcontentloaded' });
                  if (!response || response.status() >= 400) {
                    throw new Error(`${viewport.name}/${theme} ${route}: HTTP ${response?.status()}`);
                  }
                  await page.waitForLoadState('networkidle');
                  await page.locator('[data-site-header]').waitFor({ state: 'visible', timeout: 5000 });
                  const actualTheme = await page.locator('html').getAttribute('data-theme');
                  if (actualTheme !== theme) throw new Error(`${viewport.name}/${theme} ${route}: theme=${actualTheme}`);
                  const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
                  if (overflow > 1) throw new Error(`${viewport.name}/${theme} ${route}: horizontal overflow ${overflow}px`);
                  if (route === '/' && await page.locator('.global-quick-view').count() !== 0) {
                    throw new Error('global quick-view unexpectedly mounted on home');
                  }
                  if (errors.length) throw new Error(`${viewport.name}/${theme} ${route}: ${errors.join(' | ')}`);
                  checks += 1;
                  await page.close();
                }
                await context.close();
              }
            }

            // Existing command-search on-demand contract.
            {
              const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
              const page = await context.newPage();
              const requests = [];
              const errors = [];
              page.on('request', request => { if (request.url().includes('/search-index.json')) requests.push(request.url()); });
              page.on('pageerror', error => errors.push(error.message));
              page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
              await page.goto(`${baseURL}/`, { waitUntil: 'networkidle' });
              if (requests.length !== 0) throw new Error(`search index requested before open: ${requests.length}`);
              await page.getByRole('button', { name: '搜索' }).click();
              const search = page.getByRole('searchbox', { name: '搜索模型、alias、厂商、家族或论文…' });
              await search.fill('qwen3-8b');
              const result = page.locator('.command-results a').first();
              await result.waitFor({ state: 'visible', timeout: 5000 });
              const href = await result.getAttribute('href');
              if (!href || !href.includes('/models/qwen3-8b/')) throw new Error(`unexpected search result href: ${href}`);
              await page.waitForFunction(() => performance.getEntriesByType('resource').filter(entry => entry.name.includes('/search-index.json')).length === 1);
              if (requests.length !== 1) throw new Error(`expected exactly one search index request after open, got ${requests.length}`);
              await page.keyboard.press('Escape');
              if (await page.locator('dialog[open]').count()) throw new Error('command dialog remained open after Escape');
              if (errors.length) throw new Error(`command search errors: ${errors.join(' | ')}`);
              await context.close();
            }

            // Deterministic real-Production SSR-first-click QuickView path:
            // prevent the visible trigger island from hydrating, then click its SSR button.
            {
              const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
              const page = await context.newPage();
              const modelRequests = [];
              await page.route(/\/PaperRoleDiagram\.[^/]+\.js(?:\?.*)?$/, route => route.abort());
              page.on('request', request => { if (request.url().includes('/model-data/')) modelRequests.push(request.url()); });
              const response = await page.goto(`${baseURL}/papers/agentbench/`, { waitUntil: 'domcontentloaded' });
              if (!response || response.status() >= 400) throw new Error(`AgentBench HTTP ${response?.status()}`);
              const island = page.locator('astro-island[component-export="PaperRoleDiagram"]');
              const trigger = page.locator('.role-model-quick-view').first();
              await trigger.scrollIntoViewIfNeeded();
              await trigger.waitFor({ state: 'visible', timeout: 5000 });
              if (!(await island.evaluate(el => el.hasAttribute('ssr')))) {
                throw new Error('PaperRoleDiagram unexpectedly hydrated; SSR-first-click condition was not exercised');
              }
              await trigger.evaluate(button => button.click());
              const dialog = page.locator('#global-model-quick-view');
              await dialog.waitFor({ state: 'visible', timeout: 5000 });
              if (!(await dialog.evaluate(el => el.hasAttribute('open')))) {
                throw new Error('QuickView dialog did not open from SSR first click');
              }
              const deadline = Date.now() + 5000;
              while (modelRequests.length < 1 && Date.now() < deadline) await page.waitForTimeout(50);
              if (modelRequests.length < 1) throw new Error('QuickView opened without requesting model data');
              console.log(`SSR_QUICKVIEW_PASS request=${modelRequests[0]}`);
              await context.close();
            }

            // Hydrated theme transition contract on Production.
            {
              const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
              await context.addInitScript(() => localStorage.setItem('atlas-theme', 'light'));
              const page = await context.newPage();
              await page.goto(`${baseURL}/`, { waitUntil: 'networkidle' });
              const toggle = page.locator('[data-theme-toggle]').first();
              await toggle.click();
              await page.waitForFunction(() => document.documentElement.dataset.theme === 'dark');
              await toggle.click();
              await page.waitForFunction(() => document.documentElement.dataset.theme === 'light');
              await context.close();
            }

            console.log(`WEBKIT_QUICKVIEW_PRODUCTION_PASS checks=${checks} sha=${expectedSha}`);
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
