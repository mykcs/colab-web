name: BaseModel Production Browser Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/basemodel-production-browser.yml'
      - 'ci/basemodel-production-acceptance.mjs'
      - 'ci/README.md'

permissions:
  contents: read

concurrency:
  group: basemodel-production-browser
  cancel-in-progress: true

env:
  BASEMODEL_URL: https://basemodel-preview.vercel.app

jobs:
  webkit:
    name: WebKit 26.5 production acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps webkit
      - name: Run production WebKit acceptance
        run: node ci/basemodel-production-acceptance.mjs

  lighthouse:
    name: Lighthouse production lab baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lighthouse
        run: npm install --no-save lighthouse@13.4.1
      - name: Verify Speed Insights collector is live
        run: curl -fsS "$BASEMODEL_URL/_vercel/speed-insights/script.js" -o /dev/null
      - name: Run Lighthouse mobile and desktop
        run: |
          mkdir -p lighthouse-results
          npx lighthouse "$BASEMODEL_URL/" \
            --only-categories=performance \
            --output=json \
            --output-path=lighthouse-results/home-mobile.json \
            --chrome-flags='--headless --no-sandbox --disable-gpu' \
            --quiet
          npx lighthouse "$BASEMODEL_URL/" \
            --preset=desktop \
            --only-categories=performance \
            --output=json \
            --output-path=lighthouse-results/home-desktop.json \
            --chrome-flags='--headless --no-sandbox --disable-gpu' \
            --quiet
          npx lighthouse "$BASEMODEL_URL/research/seed-openevo/results/" \
            --only-categories=performance \
            --output=json \
            --output-path=lighthouse-results/results-mobile.json \
            --chrome-flags='--headless --no-sandbox --disable-gpu' \
            --quiet
          npx lighthouse "$BASEMODEL_URL/research/seed-openevo/results/" \
            --preset=desktop \
            --only-categories=performance \
            --output=json \
            --output-path=lighthouse-results/results-desktop.json \
            --chrome-flags='--headless --no-sandbox --disable-gpu' \
            --quiet
      - name: Print summary and enforce regression budgets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'home-mobile.json',
            'home-desktop.json',
            'results-mobile.json',
            'results-desktop.json',
          ];
          const limits = {
            scoreMin: 90,
            lcpMaxMs: 3000,
            tbtMaxMs: 300,
            clsMax: 0.1,
          };
          const failures = [];
          for (const file of files) {
            const r = JSON.parse(fs.readFileSync(`lighthouse-results/${file}`, 'utf8'));
            const a = r.audits;
            const summary = {
              file,
              score: Math.round((r.categories.performance.score || 0) * 100),
              fcp_ms: Math.round(a['first-contentful-paint'].numericValue),
              lcp_ms: Math.round(a['largest-contentful-paint'].numericValue),
              tbt_ms: Math.round(a['total-blocking-time'].numericValue),
              cls: Number(a['cumulative-layout-shift'].numericValue.toFixed(4)),
              speed_index_ms: Math.round(a['speed-index'].numericValue),
            };
            console.log('LIGHTHOUSE_SUMMARY', JSON.stringify(summary));
            if (summary.score < limits.scoreMin) failures.push(`${file}: score ${summary.score} < ${limits.scoreMin}`);
            if (summary.lcp_ms > limits.lcpMaxMs) failures.push(`${file}: LCP ${summary.lcp_ms}ms > ${limits.lcpMaxMs}ms`);
            if (summary.tbt_ms > limits.tbtMaxMs) failures.push(`${file}: TBT ${summary.tbt_ms}ms > ${limits.tbtMaxMs}ms`);
            if (summary.cls > limits.clsMax) failures.push(`${file}: CLS ${summary.cls} > ${limits.clsMax}`);
          }
          if (failures.length) {
            console.error('LIGHTHOUSE_BUDGET_FAILURES');
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }
          console.log('LIGHTHOUSE_BUDGETS_PASS', JSON.stringify(limits));
          NODE
      - name: Upload Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basemodel-lighthouse
          path: lighthouse-results/*.json
          retention-days: 14
