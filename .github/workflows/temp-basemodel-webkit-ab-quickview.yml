name: Temporary BaseModel WebKit QuickView Diagnostics

on:
  push:
    branches:
      - temp/basemodel-webkit-ab-quickview-20260821
  pull_request:
    branches:
      - main

jobs:
  webkit-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          mkdir -p /tmp/basemodel-webkit
          cd /tmp/basemodel-webkit
          npm init -y
          npm install @playwright/test@1.62.1
          npx playwright install --with-deps webkit
      - name: Diagnose island readiness on Production
        working-directory: /tmp/basemodel-webkit
        env:
          BASE_URL: https://basemodel-preview.vercel.app
          BASELINE_SHA: 68eeb09d0347dcb901a1f2d407314d67444fe443
        run: |
          node <<'NODE'
          const { webkit } = require('@playwright/test');

          (async () => {
            const browser = await webkit.launch();
            const baseURL = process.env.BASE_URL;

            async function diagnose(path, triggerSelector, triggerIslandExport) {
              const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
              await context.addInitScript(() => {
                window.__quickViewDiag = { showModalCalls: 0, closeCalls: 0 };
                const showModal = HTMLDialogElement.prototype.showModal;
                const close = HTMLDialogElement.prototype.close;
                HTMLDialogElement.prototype.showModal = function(...args) {
                  window.__quickViewDiag.showModalCalls += 1;
                  return showModal.apply(this, args);
                };
                HTMLDialogElement.prototype.close = function(...args) {
                  window.__quickViewDiag.closeCalls += 1;
                  return close.apply(this, args);
                };
              });
              const page = await context.newPage();
              const modelRequests = [];
              const errors = [];
              page.on('request', req => { if (req.url().includes('/model-data/')) modelRequests.push(req.url()); });
              page.on('pageerror', error => errors.push(`pageerror:${error.message}`));
              page.on('console', msg => { if (msg.type() === 'error') errors.push(`console:${msg.text()}`); });
              await page.goto(`${baseURL}${path}`, { waitUntil: 'networkidle' });

              const receiverIsland = page.locator('astro-island[component-export="GlobalModelQuickView"]');
              const triggerIsland = page.locator(`astro-island[component-export="${triggerIslandExport}"]`);
              const trigger = page.locator(triggerSelector).first();
              await trigger.scrollIntoViewIfNeeded();
              await trigger.waitFor({ state: 'visible', timeout: 5000 });

              const snapshot = async label => {
                const value = await page.evaluate(({ label, triggerExport }) => {
                  const receiver = document.querySelector('astro-island[component-export="GlobalModelQuickView"]');
                  const triggerIsland = document.querySelector(`astro-island[component-export="${triggerExport}"]`);
                  const dialog = document.querySelector('.global-quick-view');
                  return {
                    label,
                    receiverClient: receiver?.getAttribute('client') ?? null,
                    receiverSSR: receiver?.hasAttribute('ssr') ?? null,
                    triggerClient: triggerIsland?.getAttribute('client') ?? null,
                    triggerSSR: triggerIsland?.hasAttribute('ssr') ?? null,
                    dialogOpenAttr: dialog?.hasAttribute('open') ?? null,
                    dialogOpenProp: dialog?.open ?? null,
                    diag: window.__quickViewDiag,
                  };
                }, { label, triggerExport: triggerIslandExport });
                value.modelRequests = modelRequests.length;
                value.errors = [...errors];
                console.log('DIAG', path, JSON.stringify(value));
                return value;
              };

              await snapshot('after-scroll-before-click');
              await trigger.click();
              await page.waitForTimeout(750);
              const first = await snapshot('750ms-after-first-click');

              // Wait explicitly for both islands to finish Astro hydration, then click again.
              await receiverIsland.evaluate(el => el.hasAttribute('ssr')).catch(() => null);
              await page.waitForFunction(({ triggerExport }) => {
                const receiver = document.querySelector('astro-island[component-export="GlobalModelQuickView"]');
                const triggerIsland = document.querySelector(`astro-island[component-export="${triggerExport}"]`);
                return receiver && triggerIsland && !receiver.hasAttribute('ssr') && !triggerIsland.hasAttribute('ssr');
              }, { triggerExport: triggerIslandExport }, { timeout: 7000 }).catch(() => null);
              await snapshot('after-hydration-wait-before-second-click');
              await trigger.click();
              await page.waitForTimeout(750);
              const second = await snapshot('750ms-after-second-click');

              console.log('SUMMARY', path, JSON.stringify({ first, second, modelRequests, errors }));
              await context.close();
              return { first, second };
            }

            const paper = await diagnose('/papers/agentbench/', '.role-model-quick-view', 'PaperRoleDiagram');
            const family = await diagnose('/families/', '.tree-quick-view', 'default');

            console.log('WEBKIT_QUICKVIEW_DIAGNOSTICS_DONE', JSON.stringify({ paper, family, baseline: process.env.BASELINE_SHA }));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
