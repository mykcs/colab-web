name: Temporary BaseModel WebKit QuickView Bridge A-B

on:
  push:
    branches:
      - temp/basemodel-webkit-ab-quickview-20260821
  pull_request:
    branches:
      - main

jobs:
  webkit-bridge-ab:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 12
    steps:
      - name: Install matching Playwright package
        run: |
          mkdir -p /tmp/basemodel-webkit
          cd /tmp/basemodel-webkit
          npm init -y
          npm install @playwright/test@1.62.1
      - name: Validate preloaded delegated QuickView bridge on Production
        working-directory: /tmp/basemodel-webkit
        env:
          BASE_URL: https://basemodel-preview.vercel.app
          BASELINE_SHA: 68eeb09d0347dcb901a1f2d407314d67444fe443
        run: |
          node <<'NODE'
          const { webkit } = require('@playwright/test');

          (async () => {
            const browser = await webkit.launch();
            const baseURL = process.env.BASE_URL;

            async function verify(path, triggerSelector, triggerIslandExport) {
              const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
              await context.addInitScript(() => {
                window.__quickViewBridgeDiag = { bridgeCalls: 0, showModalCalls: 0 };
                const showModal = HTMLDialogElement.prototype.showModal;
                HTMLDialogElement.prototype.showModal = function(...args) {
                  window.__quickViewBridgeDiag.showModalCalls += 1;
                  return showModal.apply(this, args);
                };
              });

              const page = await context.newPage();
              const modelRequests = [];
              const errors = [];
              page.on('request', request => { if (request.url().includes('/model-data/')) modelRequests.push(request.url()); });
              page.on('pageerror', error => errors.push(error.message));
              page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
              await page.goto(`${baseURL}${path}`, { waitUntil: 'networkidle' });

              // Emulate a bundled Astro bridge: preload the exact production store first,
              // then install a synchronous delegated listener that never waits on import().
              await page.evaluate(async () => {
                const store = await import('/_astro/ui.Co5TKrLJ.js');
                window.__quickViewStore = store;
                document.addEventListener('click', event => {
                  const target = event.target;
                  if (!(target instanceof Element)) return;
                  const button = target.closest('.role-model-quick-view, .tree-quick-view');
                  if (!button) return;
                  const scope = button.closest('.role-model-actions, .tree-checkpoint');
                  const link = scope?.querySelector('a[href*="/models/"]');
                  const href = link?.getAttribute('href') ?? '';
                  const match = href.match(/\/models\/([^/]+)\/?$/);
                  if (!match) return;
                  window.__quickViewBridgeDiag.bridgeCalls += 1;
                  window.__quickViewStore.r(decodeURIComponent(match[1]));
                }, true);
              });

              const trigger = page.locator(triggerSelector).first();
              await trigger.scrollIntoViewIfNeeded();
              await trigger.waitFor({ state: 'visible', timeout: 5000 });
              const before = await page.evaluate(triggerExport => {
                const receiver = document.querySelector('astro-island[component-export="GlobalModelQuickView"]');
                const triggerIsland = document.querySelector(`astro-island[component-export="${triggerExport}"]`);
                return {
                  receiverSSR: receiver?.hasAttribute('ssr') ?? null,
                  triggerSSR: triggerIsland?.hasAttribute('ssr') ?? null,
                  storeValue: window.__quickViewStore.i.get(),
                };
              }, triggerIslandExport);

              // Use a synchronous DOM click so the bridge is exercised at the exact hydration edge.
              await trigger.evaluate(button => button.click());
              await page.locator('.global-quick-view').waitFor({ state: 'visible', timeout: 5000 });
              const after = await page.evaluate(() => ({
                open: document.querySelector('.global-quick-view')?.open ?? false,
                storeValue: window.__quickViewStore.i.get(),
                diag: window.__quickViewBridgeDiag,
              }));
              if (after.diag.bridgeCalls < 1) throw new Error(`${path}: delegated bridge did not run`);
              if (after.diag.showModalCalls < 1) throw new Error(`${path}: receiver did not call showModal`);
              if (!after.storeValue) throw new Error(`${path}: QuickView store was not updated`);
              if (modelRequests.length < 1) throw new Error(`${path}: no model-data request after bridge click`);
              if (errors.length) throw new Error(`${path}: ${errors.join(' | ')}`);
              console.log('BRIDGE_PASS', path, JSON.stringify({ before, after, modelRequests }));
              await context.close();
            }

            await verify('/papers/agentbench/', '.role-model-quick-view', 'PaperRoleDiagram');
            await verify('/families/', '.tree-quick-view', 'default');
            console.log(`WEBKIT_QUICKVIEW_BRIDGE_PASS baseline=${process.env.BASELINE_SHA}`);
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
